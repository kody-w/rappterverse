name: Static API 🗂️

# rapp-static-api/1.0 — https://github.com/kody-w/rapp-static-apis
#
# Two jobs, deliberately split:
#
#   verify    — read-only, runs on every PR. Checks the *structural* contract
#               (every declared document carries its `schema` string, the index
#               and endpoints exist, .nojekyll is present). It does NOT compare
#               hashes, because §3 "Liveness" makes the index the latest known
#               state, not a freshness contract — gating action PRs on index
#               staleness would recreate the un-passable gate this repo removed
#               in docs/SPEC_DRIFT.md D6.
#
#   rebuild   — regenerates the index and endpoints and queues the result
#               through the durable state reconciler, exactly like every other
#               state producer. Manual only, matching the repo convention that
#               scheduled compute lives in scripts/local_platform.sh (which
#               already runs this build every cycle via job_static_api).

on:
  pull_request:
    paths:
      - 'state/**'
      - 'feed/**'
      - 'manifest.json'
      - 'registry.json'
      - 'api/**'
      - 'scripts/static_api.py'
      - 'scripts/build_static_api.py'
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify rapp-static-api/1.0 conformance
        run: |
          python3 scripts/build_static_api.py --check || {
            echo ""
            echo "Every served state document must keep its \`schema\` string."
            echo "Regenerate it with a single command, then commit the result:"
            echo ""
            echo "    python3 scripts/build_static_api.py"
            echo ""
            exit 1
          }

  rebuild:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild index and versioned endpoints
        run: python3 scripts/build_static_api.py

      - name: Queue the result
        id: create_pr
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Index already current — nothing to queue (stable-write held)."
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "action@github.com"
          BRANCH="auto/static-api-$(date +%s)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "[state] Rebuild rapp-static-api/1.0 index"
          git push --set-upstream origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "[state] Rebuild rapp-static-api/1.0 index" \
            --body "Regenerated by \`scripts/build_static_api.py\` (the one build step). Queued through state-drain.yml." \
            --base main \
            --head "$BRANCH")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "has_pr=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wake durable state queue
        if: steps.create_pr.outputs.has_pr == 'true'
        run: gh workflow run state-drain.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
